<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Left Ribbon Arm Gradient (Deep Blue to Royal Blue) -->
    <linearGradient id="nLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Diagonal Fold Gradient (Royal Blue to Cyan) -->
    <linearGradient id="nDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Right Ribbon Arm Gradient (Cyan to Emerald) -->
    <linearGradient id="nRight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Badge Ring Gradient -->
    <linearGradient id="badgeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#002288" flood-opacity="0.30" />
    </filter>
  </defs>

  <!-- Right Ribbon Arm (Underneath - Cyan to Emerald) -->
  <path
    d="M 330 90
       C 365 90, 390 115, 390 150
       L 390 270
       C 360 250, 330 260, 300 280
       L 300 150
       C 300 115, 310 90, 330 90 Z"
    fill="url(#nRight)"
  />

  <!-- Main Ribbon N Body (Left Arm + Diagonal) -->
  <path
    d="M 175 75
       C 225 75, 260 105, 310 155
       L 345 195
       L 260 410
       C 230 445, 190 445, 160 410
       C 135 380, 125 340, 125 290
       L 125 145
       C 125 105, 145 75, 175 75 Z"
    fill="url(#nLeft)"
  />

  <!-- Ribbon Bend Highlight -->
  <path
    d="M 175 75
       C 230 75, 275 115, 360 220
       C 335 255, 300 260, 270 220
       L 180 120
       C 150 90, 155 75, 175 75 Z"
    fill="url(#nDiag)"
    opacity="0.9"
  />

  <!-- Magnifying Glass Handle -->
  <rect
    x="345"
    y="330"
    width="38"
    height="105"
    rx="19"
    transform="rotate(-45 345 330)"
    fill="url(#handleGrad)"
    filter="url(#badgeShadow)"
  />

  <!-- Outer Badge Ring (Magnifying Glass Lens) -->
  <circle
    cx="315"
    cy="300"
    r="86"
    fill="url(#badgeRing)"
    filter="url(#badgeShadow)"
  />

  <!-- Inner Pure White Disc -->
  <circle
    cx="315"
    cy="300"
    r="64"
    fill="#FFFFFF"
  />

  <!-- Vibrant Emerald Checkmark inside Badge -->
  <path
    d="M 285 302
       L 305 322
       L 348 274"
    stroke="#10B981"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>